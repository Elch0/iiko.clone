name: Scheduled cake price update

on:
  schedule:
    - cron: '1 19 12 10 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Apply scheduled prices
        run: |
          python apply_scheduled_cake_prices.py
          python gen_embedded.py

      - name: Commit and push catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json _embedded_catalog.py
          if git diff --cached --quiet; then
            echo "No catalog change to publish."
          else
            git commit -m "Apply scheduled cake prices"
            git push origin main
          fi
